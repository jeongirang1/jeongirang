 <section class="bg-carousel">
  <img src="assets/move6.jpg" alt="move6 background" class="bg-img" />

  <div class="overlay">
    <button class="nav prev" type="button" aria-label="Previous">‹</button>

    <img id="overlayImage" src="assets/move7.jpg" alt="move7" class="overlay-img" />

    <button class="nav next" type="button" aria-label="Next">›</button>
  </div>
 </section>


</main>

 <script>
  const overlayImages = [
    "assets/move7.jpg",
    "assets/move8.jpg",
    "assets/move11.jpg",
    "assets/move12.jpg",
    "assets/move13.jpg"
  ];

  let i = 0;

  const img = document.getElementById("overlayImage");
  const prev = document.querySelector(".nav.prev");
  const next = document.querySelector(".nav.next");

  function render() {
    img.style.opacity = 0;

    setTimeout(() => {
      img.src = overlayImages[i];
      img.alt = overlayImages[i].split("/").pop().replace(".jpg", "");
      img.style.opacity = 1;
    }, 180);
  }

  prev.addEventListener("click", () => {
    i = (i - 1 + overlayImages.length) % overlayImages.length;
    render();
  });

  next.addEventListener("click", () => {
    i = (i + 1) % overlayImages.length;
    render();
  });

  render();
 </script>
