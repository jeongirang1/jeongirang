 <section class="installation-slider">
  <button class="arrow left" aria-label="previous"> ‹ </button>

  <div class="slider-window">
   <div class="slider-track">
    <img src="assets/person-install1.jpg" alt="install1" />
    <img src="assets/person-install2.jpg" alt="install2" />
    <img src="assets/person-install3.jpg" alt="install3" />

    <img src="assets/person-install7.jpg" alt="install7" />
    <img src="assets/person-install8.jpg" alt="install8" />
   </div>
  </div>

  <button class="arrow right" aria-label="next"> › </button>
 </section>

<script>
  const track = document.querySelector('.slider-track');
  const slides = document.querySelectorAll('.slider-track img');
  const prevBtn = document.querySelector('.arrow.left');
  const nextBtn = document.querySelector('.arrow.right');

  let index = 0;
  const total = slides.length;

  function updateSlider() {
    track.style.transform = `translateX(-${index * 100}%)`;
  }

  nextBtn.addEventListener('click', () => {
    index = (index + 1) % total;
    updateSlider();
  });

  prevBtn.addEventListener('click', () => {
    index = (index - 1 + total) % total;
    updateSlider();
  });
</script>
