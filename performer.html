 <section class="installation-slider">
  <button class="pf-arrow left" aria-label="previous"> ‹ </button>

  <div class="slider-window">
   <div class="slider-track">
 <img src="assets/pf6.jpg" alt="pf6" />
 <img src="assets/pf7.jpg" alt="pf7" />
 <img src="assets/pf8.jpg" alt="pf8" />
 <img src="assets/pf9.jpg" alt="pf9" />
   </div>
  </div>

  <button class="pf-arrow right" aria-label="next"> › </button>
 </section>

<script>
  const track = document.querySelector('.slider-track');
  const slides = document.querySelectorAll('.slider-track img');
  const prevBtn = document.querySelector('.pf-arrow.left');
  const nextBtn = document.querySelector('.pf-arrow.right');

  let index = 0;
  const total = slides.length;

  function updateSlider() {
    track.style.transform = `translateX(-${index * 100}%)`;
  }

  nextBtn.addEventListener('click', () => {
    index = (index + 1) % total;
    updateSlider();
  });

  prevBtn.addEventListener('click', () => {
    index = (index - 1 + total) % total;
    updateSlider();
  });
</script>
